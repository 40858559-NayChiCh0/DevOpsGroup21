name: A workflow for Population Report System

on:
  push

jobs:
  build:
    name: Population Report action
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Compile with Maven
        run: mvn compile

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: devopsimage:latest
          load: true

      - name: Run Docker Container
        run: |
          docker run --name devopscontainer -d devopsimage:latest

      - name: View Container Logs (Non-blocking)
        run: |
          docker logs devopscontainer
