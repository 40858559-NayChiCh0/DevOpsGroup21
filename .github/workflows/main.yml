
name: A workflow for Population Report System

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - develop
      - master

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Start MySQL Database
        run: docker compose up -d --wait db

      - name: Run Unit Tests
        run: mvn -B test

      - name: View Database Logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color db

      - name: Clean Up
        if: always()
        run: docker compose down -v

  Build:
    name: Build and Start Using docker-compose
    runs-on: ubuntu-26.04
    needs: UnitTests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Package with Maven
        run: mvn -B clean package -DskipTests

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build and Run Docker Compose
        run: |
          docker compose -f docker-compose.yml up \
            --build \
            --exit-code-from app

      - name: View Container Logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color app db

      - name: Clean Up
        if: always()
        run: docker compose down -v
