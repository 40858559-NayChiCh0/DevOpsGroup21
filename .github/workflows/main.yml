
name: A workflow for Population Report System

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - develop
      - master

jobs:

  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn -B -DexcludedGroups=integration test


  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Start MySQL Database
        run: docker compose up -d db

      - name: Wait for MySQL Database
        run: |
          echo "Waiting for the world database..."

          for i in {1..30}; do
            if docker compose exec -T db sh -c \
              'mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE world; SELECT COUNT(*) FROM city;"' \
              > /dev/null 2>&1; then

              echo "MySQL database is ready!"
              exit 0
            fi

            echo "Attempt $i: MySQL not ready yet"
            sleep 3
          done

          docker compose logs db
          exit 1

      - name: Run Integration Tests
        env:
          DB_HOST: localhost
          DB_PORT: '33060'
          DB_NAME: world
          DB_USER: devops
          DB_PASSWORD: devops
        run: mvn -B -Dgroups=integration test

      - name: Show MySQL Logs on Failure
        if: failure()
        run: docker compose logs db

      - name: Stop MySQL Database
        if: always()
        run: docker compose down


  # ================================================
  # BUILD AND DOCKER COMPOSE
  # ================================================
  Build:
    name: Build and Start Using docker-compose
    runs-on: ubuntu-24.04

    needs:
      - UnitTests
      - IntegrationTests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Package with Maven
        run: mvn -B clean package -DskipTests

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build and Run Docker Compose
        run: |
          docker compose -f docker-compose.yml up \
            --build \
            --exit-code-from app

      - name: View Container Logs
        if: always()
        run: |
          docker compose -f docker-compose.yml ps -a
          docker compose -f docker-compose.yml logs --no-color app db

      - name: Clean Up
        if: always()
        run: docker compose -f docker-compose.yml down -v
