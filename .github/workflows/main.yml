
name: A workflow for Population Report System

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - develop
      - master

jobs:

  # ==========================================
  # JOB 1: UNIT TESTS AND CODECOV
  # ==========================================
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Start MySQL Database
        run: docker compose up -d db

      - name: Wait for MySQL Database
        run: |
          echo "Waiting for the world database..."
          for i in {1..30}; do
            if docker compose exec -T db sh -c \
              'mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE world; SELECT COUNT(*) FROM city;"' \
              > /dev/null 2>&1; then
              echo "MySQL database is ready!"
              exit 0
            fi
            echo "Attempt $i: MySQL not ready yet"
            sleep 3
          done
          docker compose logs db
          exit 1

      - name: Run Unit Tests
        env:
          DB_HOST: localhost
          DB_PORT: '33061'
          DB_NAME: world
          DB_USER: devops
          DB_PASSWORD: devops
        run: mvn -B -DexcludedGroups=integration test

      # Generate JaCoCo XML report
      - name: Generate JaCoCo Coverage Report
        run: mvn -B jacoco:report

      # Upload Unit Test Coverage
      - name: Upload Unit Test Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          flags: unit-tests
          fail_ci_if_error: true
          verbose: true

      - name: Show MySQL Logs on Failure
        if: failure()
        run: docker compose logs db

      - name: Stop MySQL Database
        if: always()
        run: docker compose down


  # ==========================================
  # JOB 2: INTEGRATION TESTS AND CODECOV
  # ==========================================
  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Start MySQL Database
        run: docker compose up -d db

      - name: Wait for MySQL Database
        run: |
          echo "Waiting for the world database..."
          for i in {1..30}; do
            if docker compose exec -T db sh -c \
              'mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE world; SELECT COUNT(*) FROM city;"' \
              > /dev/null 2>&1; then
              echo "MySQL database is ready!"
              exit 0
            fi
            echo "Attempt $i: MySQL not ready yet"
            sleep 3
          done
          docker compose logs db
          exit 1

      - name: Run Integration Tests
        env:
          DB_HOST: localhost
          DB_PORT: '33061'
          DB_NAME: world
          DB_USER: devops
          DB_PASSWORD: devops
        run: mvn -B -Dgroups=integration test

      # Generate JaCoCo XML report
      - name: Generate JaCoCo Coverage Report
        run: mvn -B jacoco:report

      # Upload Integration Test Coverage
      - name: Upload Integration Test Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          flags: integration-tests
          fail_ci_if_error: true
          verbose: true

      - name: Show MySQL Logs on Failure
        if: failure()
        run: docker compose logs db

      - name: Stop MySQL Database
        if: always()
        run: docker compose down


  # ==========================================
  # JOB 3: BUILD AND RUN DOCKER
  # ==========================================
  Build:
    name: Build and Start Using docker-compose
    runs-on: ubuntu-24.04

    needs:
      - UnitTests
      - IntegrationTests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Package with Maven
        run: mvn -B clean package -DskipTests

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build and Run Docker Compose
        run: |
          docker compose -f docker-compose.yml up \
            --build \
            --exit-code-from app

      - name: View Container Logs
        if: always()
        run: |
          docker compose -f docker-compose.yml ps -a
          docker compose -f docker-compose.yml logs --no-color app db

      - name: Clean Up
        if: always()
        run: docker compose -f docker-compose.yml down -v

      - name: Upload JAR for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: population-report-jar
          path: target/devops.jar
          if-no-files-found: error
          overwrite: true


  # ==========================================
  # JOB 4: AUTOMATIC GITHUB RELEASE
  # ==========================================
  Release:
    name: GitHub Release
    needs: Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download the JAR
        uses: actions/download-artifact@v8
        with:
          name: population-report-jar
          path: target

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" target/devops.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Population Report System $tag" \
            --generate-notes
