name: A workflow for Population Report System

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  Tests:
    name: Unit Tests, Integration Tests and Coverage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start MySQL Database
        run: docker compose up -d --wait db

      - name: Check Database
        run: docker compose ps

      - name: Verify World Database
        run: |
          docker compose exec -T db \
            mysql -uroot -pdevops \
            -e "SELECT COUNT(*) FROM world.country;"

      - name: Run All Tests
        run: mvn -B clean verify

      - name: Check JaCoCo Report
        run: test -s target/site/jacoco/jacoco.xml

      - name: Upload Coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      - name: Show Database Logs on Failure
        if: failure()
        run: docker compose logs db

      - name: Clean Up
        if: always()
        run: docker compose down
